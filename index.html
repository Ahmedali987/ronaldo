<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RonaldoSmS Bot Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Table Customizations for Mobile */
        .table-container {
            overflow-x: auto;
        }
    </style>
</head>
<body class="bg-gray-200 text-gray-800 font-sans pb-10">

    <!-- Top Navigation (Updated) -->
    <nav class="bg-black text-white px-4 py-4 flex items-center justify-center shadow-md">
        <h1 class="text-xl font-bold tracking-wider">RonaldoSmS Bot</h1>
    </nav>

    <div class="max-w-7xl mx-auto p-2 sm:p-4 space-y-6">

        <!-- SECTION 1: TEST NUMBERS -->
        <div class="bg-white shadow-md rounded border border-gray-300">
            <div class="bg-gray-100 border-b border-gray-300 px-4 py-3 flex flex-wrap justify-between items-center">
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Test Numbers</h2>
                <div id="numTotalBadge" class="bg-cyan-100 text-cyan-800 text-xs font-bold px-3 py-1 rounded border border-cyan-300">
                    Total: 0
                </div>
            </div>
            
            <div class="p-4 space-y-4">
                <!-- Controls: Search Bar & Dropdown -->
                <div class="flex flex-col sm:flex-row sm:items-center space-y-3 sm:space-y-0 sm:space-x-4">
                    <!-- Search Input -->
                    <div class="flex items-center space-x-2 w-full sm:w-auto">
                        <label for="numSearchInput" class="font-semibold text-gray-700 text-sm">Search:</label>
                        <input type="text" id="numSearchInput" placeholder="Range, prefix or number..." class="border border-gray-300 rounded px-3 py-2 text-sm w-full sm:w-64 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
                    </div>

                    <!-- Range Dropdown -->
                    <div class="flex items-center space-x-2 w-full sm:w-auto">
                        <label for="numRangeFilter" class="font-semibold text-gray-700 text-sm">Range:</label>
                        <select id="numRangeFilter" class="border border-gray-300 rounded px-3 py-2 text-sm w-full sm:w-48 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
                            <option value="All">-- Show All Ranges --</option>
                            <!-- Options injected by JS -->
                        </select>
                    </div>

                    <div class="flex items-center space-x-2">
                        <label class="font-semibold text-gray-700 text-sm">Show:</label>
                        <select id="numLimit" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-cyan-500">
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>

                <!-- Test Numbers Table -->
                <div class="table-container border border-gray-200">
                    <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="p-3 font-semibold text-gray-600">Range ↕</th>
                                <th class="p-3 font-semibold text-gray-600">Prefix ↕</th>
                                <th class="p-3 font-semibold text-gray-600">Test Number ↕ <span class="text-xs font-normal text-gray-400 ml-1">(Click to copy)</span></th>
                            </tr>
                        </thead>
                        <tbody id="testNumbersTableBody" class="divide-y divide-gray-200">
                            <!-- Data injected via JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination Footer -->
                <div class="flex flex-col sm:flex-row justify-between items-center bg-gray-50 p-3 border border-gray-200 rounded text-sm">
                    <div id="numInfo" class="text-gray-600 mb-2 sm:mb-0">Showing 0 to 0 of 0 entries</div>
                    <div id="numPagination" class="flex space-x-1">
                        <!-- Pagination Buttons injected here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- SECTION 2: RECENT INBOUND (OTP SECTION) -->
        <div class="bg-white shadow-md rounded border border-gray-300">
            <div class="bg-gray-100 border-b border-gray-300 px-4 py-3 flex flex-wrap justify-between items-center gap-2">
                <div class="flex items-center space-x-3">
                    <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Recent Inbound</h2>
                    <div id="otpTotalBadge" class="bg-cyan-100 text-cyan-800 text-xs font-bold px-3 py-1 rounded border border-cyan-300">
                        Total OTPs: 0
                    </div>
                </div>
                <button onclick="handleRefresh()" class="bg-cyan-500 hover:bg-cyan-600 text-white px-3 py-1.5 rounded text-sm font-semibold transition flex items-center space-x-1 shadow-sm active:bg-cyan-700">
                    <svg id="refreshIcon" class="w-4 h-4 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>REFRESH</span>
                </button>
            </div>
            
            <div class="p-4 space-y-4">
                <!-- INBOUND Controls: Search Bar & Dropdown -->
                <div class="flex flex-col sm:flex-row sm:items-center space-y-3 sm:space-y-0 sm:space-x-4">
                    <div class="flex items-center space-x-2 w-full sm:w-auto">
                        <label for="otpSearchInput" class="font-semibold text-gray-700 text-sm">Search:</label>
                        <input type="text" id="otpSearchInput" placeholder="Range, number, OTP..." class="border border-gray-300 rounded px-3 py-2 text-sm w-full sm:w-64 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
                    </div>
                    <div class="flex items-center space-x-2 w-full sm:w-auto">
                        <label for="otpRangeFilter" class="font-semibold text-gray-700 text-sm">Range:</label>
                        <select id="otpRangeFilter" class="border border-gray-300 rounded px-3 py-2 text-sm w-full sm:w-48 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
                            <option value="All">-- Show All Ranges --</option>
                        </select>
                    </div>
                    <div class="flex items-center space-x-2">
                        <label class="font-semibold text-gray-700 text-sm">Show:</label>
                        <select id="otpLimit" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-cyan-500">
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>

                <!-- Recent Inbound Table -->
                <div class="table-container border border-gray-200">
                    <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="p-3 font-semibold text-gray-600">Date ↕</th>
                                <th class="p-3 font-semibold text-gray-600">Range ↕</th>
                                <th class="p-3 font-semibold text-gray-600">Number ↕</th>
                                <th class="p-3 font-semibold text-gray-600">CLI (OTP) ↕</th>
                            </tr>
                        </thead>
                        <tbody id="inboundTableBody" class="divide-y divide-gray-200">
                            <!-- Data injected via JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination Footer -->
                <div class="flex flex-col sm:flex-row justify-between items-center bg-gray-50 p-3 border border-gray-200 rounded text-sm">
                    <div id="otpInfo" class="text-gray-600 mb-2 sm:mb-0">Showing 0 to 0 of 0 entries</div>
                    <div id="otpPagination" class="flex space-x-1">
                        <!-- Pagination Buttons injected here -->
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Tailwind Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center space-x-2 translate-y-4">
        <svg id="toastIcon" class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toastMessage" class="font-medium">Number copied to clipboard!</span>
    </div>

    <script>
        /* =====================================================================
           MOCK ADMIN DATA
           (Multiplied data so pagination triggers > 25 records visually)
           ===================================================================== */
        const baseAdminUploadedNumbers = [
            { range: 'Malaysia XOX LX 21Sep', prefix: '60', number: '601159053068' },
            { range: 'Malaysia XOX LX 21Sep', prefix: '60', number: '601159172628' },
            { range: 'Malaysia Maxis LX 21Sep', prefix: '60', number: '60171909556' },
            { range: 'Malaysia Maxis LX 21Sep', prefix: '60', number: '60120786227' },
            { range: 'Malaysia Digi LX 21Sep', prefix: '60', number: '601170606547' },
            { range: 'Malaysia Celcom LX 21Sep', prefix: '60', number: '601115193873' },
            { range: 'Algeria LX 15Sep', prefix: '213', number: '213540836549' },
            { range: 'Libya (K)', prefix: '218', number: '218913609672' },
            { range: 'Sri Lanka LX 02Jul', prefix: '94', number: '94769631440' }
        ];
        // Duplicate to create 36 records to demonstrate pagination
        const adminUploadedNumbers = [...baseAdminUploadedNumbers, ...baseAdminUploadedNumbers, ...baseAdminUploadedNumbers, ...baseAdminUploadedNumbers];

        const baseReceivedOTPs = [
            { date: '2026-09-22 10:23:13', range: 'Libya (K)', number: '218913609672', otpMessage: 'THY89234' },
            { date: '2026-09-22 10:19:52', range: 'Algeria LX 15Sep', number: '213540836549', otpMessage: 'BreAK552' },
            { date: '2026-09-22 10:13:34', range: 'Algeria LX 13Mar', number: '213561066169', otpMessage: 'BreAK199' },
            { date: '2026-09-22 09:58:08', range: 'Malaysia XOX LX 21Sep', number: '601159053068', otpMessage: '44799011' },
            { date: '2026-09-22 09:52:24', range: 'Sri Lanka LX 02Jul', number: '94769631440', otpMessage: 'TikTOK99' },
            { date: '2026-09-22 09:48:12', range: 'Sri Lanka LX 15Sep', number: '94771226423', otpMessage: 'ALIX9922' }
        ];
        // Duplicate to create 30 records to demonstrate pagination
        const receivedOTPs = [...baseReceivedOTPs, ...baseReceivedOTPs, ...baseReceivedOTPs, ...baseReceivedOTPs, ...baseReceivedOTPs];


        /* =====================================================================
           USER SIDE LOGIC & PAGINATION
           ===================================================================== */
        
        let toastTimeout;
        
        // Pagination States
        let numCurrentPage = 1;
        let otpCurrentPage = 1;

        document.addEventListener('DOMContentLoaded', () => {
            populateRangeDropdowns();
            renderNumbers();
            renderInbounds();

            // NUMBERS: Event Listeners
            document.getElementById('numRangeFilter').addEventListener('change', () => { numCurrentPage = 1; renderNumbers(); });
            document.getElementById('numSearchInput').addEventListener('input', () => { numCurrentPage = 1; renderNumbers(); });
            document.getElementById('numLimit').addEventListener('change', () => { numCurrentPage = 1; renderNumbers(); });

            // OTPs: Event Listeners
            document.getElementById('otpRangeFilter').addEventListener('change', () => { otpCurrentPage = 1; renderInbounds(); });
            document.getElementById('otpSearchInput').addEventListener('input', () => { otpCurrentPage = 1; renderInbounds(); });
            document.getElementById('otpLimit').addEventListener('change', () => { otpCurrentPage = 1; renderInbounds(); });
        });

        // 1. Populate Dropdowns (Both Sections)
        function populateRangeDropdowns() {
            // Numbers dropdown
            const numDropdown = document.getElementById('numRangeFilter');
            const uniqueNumRanges = [...new Set(adminUploadedNumbers.map(item => item.range))];
            uniqueNumRanges.forEach(range => {
                numDropdown.insertAdjacentHTML('beforeend', `<option value="${range}">${range}</option>`);
            });

            // OTPs dropdown
            const otpDropdown = document.getElementById('otpRangeFilter');
            const uniqueOtpRanges = [...new Set(receivedOTPs.map(item => item.range))];
            uniqueOtpRanges.forEach(range => {
                otpDropdown.insertAdjacentHTML('beforeend', `<option value="${range}">${range}</option>`);
            });
        }

        // 2. Render Test Numbers
        function renderNumbers() {
            const filterRange = document.getElementById('numRangeFilter').value;
            const searchText = document.getElementById('numSearchInput').value.toLowerCase();
            const limit = parseInt(document.getElementById('numLimit').value);
            const tbody = document.getElementById('testNumbersTableBody');
            tbody.innerHTML = ''; 

            // Filter
            const filteredData = adminUploadedNumbers.filter(item => {
                const matchesRange = filterRange === 'All' || item.range === filterRange;
                const matchesSearch = searchText === '' || 
                                      item.range.toLowerCase().includes(searchText) || 
                                      item.prefix.toLowerCase().includes(searchText) || 
                                      item.number.toLowerCase().includes(searchText);
                return matchesRange && matchesSearch;
            });

            // Update Total Badge
            document.getElementById('numTotalBadge').textContent = `Total: ${filteredData.length}`;

            // Handle Empty State ("0 Records")
            if(filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-gray-500 font-bold text-base">0 Records Found</td></tr>`;
                document.getElementById('numInfo').textContent = `Showing 0 to 0 of 0 entries`;
                document.getElementById('numPagination').innerHTML = '';
                return;
            }

            // Pagination Math
            const totalPages = Math.ceil(filteredData.length / limit);
            if (numCurrentPage > totalPages) numCurrentPage = totalPages;
            const startIndex = (numCurrentPage - 1) * limit;
            const paginatedData = filteredData.slice(startIndex, startIndex + limit);

            // Render Rows
            paginatedData.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-blue-50 transition";
                tr.innerHTML = `
                    <td class="p-3 text-gray-700 border-b">${row.range}</td>
                    <td class="p-3 text-gray-700 border-b">${row.prefix}</td>
                    <td class="p-3 font-bold text-gray-900 border-b cursor-pointer group" 
                        onclick="copyToClipboard('${row.number}')" 
                        title="Click to copy">
                        <span class="border-b border-transparent group-hover:border-cyan-500 group-hover:text-cyan-600 transition">${row.number}</span>
                        <svg class="w-4 h-4 inline opacity-0 group-hover:opacity-100 transition-opacity ml-2 text-cyan-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Info Text
            const endIdx = Math.min(startIndex + limit, filteredData.length);
            document.getElementById('numInfo').textContent = `Showing ${startIndex + 1} to ${endIdx} of ${filteredData.length} entries`;
            
            // Render Pagination Buttons
            buildPagination(totalPages, numCurrentPage, 'numPagination', 'changeNumPage');
        }

        // Global functions for pagination clicks
        window.changeNumPage = function(page) {
            numCurrentPage = page;
            renderNumbers();
        };

        // 3. Render Recent Inbounds
        function renderInbounds() {
            const filterRange = document.getElementById('otpRangeFilter').value;
            const searchText = document.getElementById('otpSearchInput').value.toLowerCase();
            const limit = parseInt(document.getElementById('otpLimit').value);
            const tbody = document.getElementById('inboundTableBody');
            tbody.innerHTML = ''; 

            // Filter
            const filteredData = receivedOTPs.filter(item => {
                const matchesRange = filterRange === 'All' || item.range === filterRange;
                const matchesSearch = searchText === '' || 
                                      item.range.toLowerCase().includes(searchText) || 
                                      item.number.toLowerCase().includes(searchText) ||
                                      item.otpMessage.toLowerCase().includes(searchText);
                return matchesRange && matchesSearch;
            });

            // Update Total Badge
            document.getElementById('otpTotalBadge').textContent = `Total OTPs: ${filteredData.length}`;

            // Handle Empty State ("0 Records")
            if(filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-gray-500 font-bold text-base">0 Records Found</td></tr>`;
                document.getElementById('otpInfo').textContent = `Showing 0 to 0 of 0 entries`;
                document.getElementById('otpPagination').innerHTML = '';
                return;
            }

            // Pagination Math
            const totalPages = Math.ceil(filteredData.length / limit);
            if (otpCurrentPage > totalPages) otpCurrentPage = totalPages;
            const startIndex = (otpCurrentPage - 1) * limit;
            const paginatedData = filteredData.slice(startIndex, startIndex + limit);

            // Render Rows
            paginatedData.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition";
                
                // Masking Logic
                const rawOtp = row.otpMessage;
                const maskedOtp = rawOtp.length > 3 ? rawOtp.substring(0, 3) + 'XXXX' : rawOtp + 'XXXX';

                tr.innerHTML = `
                    <td class="p-3 text-gray-600 border-b">${row.date}</td>
                    <td class="p-3 text-gray-700 border-b">
                        ${row.range.split(' ')[0]} <br>
                        <span class="text-xs text-gray-400">${row.range}</span>
                    </td>
                    <td class="p-3 font-bold text-gray-900 border-b">${row.number}</td>
                    <td class="p-3 text-gray-700 border-b font-mono">${maskedOtp}</td>
                `;
                tbody.appendChild(tr);
            });

            // Info Text
            const endIdx = Math.min(startIndex + limit, filteredData.length);
            document.getElementById('otpInfo').textContent = `Showing ${startIndex + 1} to ${endIdx} of ${filteredData.length} entries`;
            
            // Render Pagination Buttons
            buildPagination(totalPages, otpCurrentPage, 'otpPagination', 'changeOtpPage');
        }

        window.changeOtpPage = function(page) {
            otpCurrentPage = page;
            renderInbounds();
        };

        // 4. Reusable Pagination Builder
        function buildPagination(totalPages, currentPage, containerId, callbackFn) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            if(totalPages <= 1) return; // Don't show pagination if only 1 page

            // Prev Button
            const prevDisabled = currentPage === 1;
            container.insertAdjacentHTML('beforeend', `
                <button onclick="${callbackFn}(${currentPage - 1})" 
                        class="px-3 py-1 border border-gray-300 bg-white text-sm rounded-l-md hover:bg-gray-100 ${prevDisabled ? 'opacity-50 cursor-not-allowed' : ''}" 
                        ${prevDisabled ? 'disabled' : ''}>
                    Prev
                </button>
            `);

            // Page Numbers
            for (let i = 1; i <= totalPages; i++) {
                const isActive = currentPage === i;
                container.insertAdjacentHTML('beforeend', `
                    <button onclick="${callbackFn}(${i})" 
                            class="px-3 py-1 border-t border-b border-r border-gray-300 text-sm ${isActive ? 'bg-cyan-500 text-white font-bold' : 'bg-white hover:bg-gray-100 text-gray-700'}">
                        ${i}
                    </button>
                `);
            }

            // Next Button
            const nextDisabled = currentPage === totalPages;
            container.insertAdjacentHTML('beforeend', `
                <button onclick="${callbackFn}(${currentPage + 1})" 
                        class="px-3 py-1 border-t border-b border-r border-gray-300 bg-white text-sm rounded-r-md hover:bg-gray-100 ${nextDisabled ? 'opacity-50 cursor-not-allowed' : ''}" 
                        ${nextDisabled ? 'disabled' : ''}>
                    Next
                </button>
            `);
        }

        // 5. Working Refresh Button
        function handleRefresh() {
            const refreshIcon = document.getElementById('refreshIcon');
            refreshIcon.classList.add('-rotate-180');
            showToast("Refreshing data...", false);

            setTimeout(() => {
                otpCurrentPage = 1; // Reset to page 1 on refresh
                renderInbounds(); 
                refreshIcon.classList.remove('-rotate-180');
                showToast("Data is up to date!", true);
            }, 800);
        }

        // 6. Copy to Clipboard
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`Copied: ${text}`, true);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                showToast(`Failed to copy`, false);
            });
        }

        // 7. Toast Notification
        function showToast(message, isSuccess = true) {
            const toast = document.getElementById("toast");
            const toastMessage = document.getElementById("toastMessage");
            const toastIcon = document.getElementById("toastIcon");

            clearTimeout(toastTimeout);
            toastMessage.textContent = message;
            
            if(isSuccess) {
                toastIcon.classList.remove("text-yellow-400", "animate-spin");
                toastIcon.classList.add("text-green-400");
                toastIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>`;
            } else {
                toastIcon.classList.remove("text-green-400");
                toastIcon.classList.add("text-yellow-400", "animate-spin");
                toastIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>`;
            }

            toast.classList.remove("opacity-0", "translate-y-4");
            toast.classList.add("opacity-100", "translate-y-0");
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove("opacity-100", "translate-y-0");
                toast.classList.add("opacity-0", "translate-y-4");
            }, 2500);
        }
    </script>
</body>
</html>

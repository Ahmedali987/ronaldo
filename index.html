<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTNs Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Table Customizations for Mobile */
        .table-container {
            overflow-x: auto;
        }
    </style>
</head>
<body class="bg-gray-200 text-gray-800 font-sans">

    <!-- Top Navigation -->
    <nav class="bg-black text-white px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <button class="bg-gray-200 text-black px-3 py-1 rounded hover:bg-gray-300 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <h1 class="text-lg font-semibold tracking-wide">RTNs</h1>
        </div>
        <div class="flex space-x-3">
            <div class="w-6 h-6 bg-gray-600 rounded-full flex items-center justify-center">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-2 sm:p-4 space-y-6">

        <!-- SECTION 1: TEST NUMBERS -->
        <div class="bg-white shadow-md rounded border border-gray-300">
            <div class="bg-gray-100 border-b border-gray-300 px-4 py-3 flex flex-wrap justify-between items-center">
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Test Numbers</h2>
            </div>
            
            <div class="p-4 space-y-4">
                <!-- Controls: Search Bar & Dropdown -->
                <div class="flex flex-col sm:flex-row sm:items-center space-y-3 sm:space-y-0 sm:space-x-4">
                    
                    <!-- Search Input -->
                    <div class="flex items-center space-x-2 w-full sm:w-auto">
                        <label for="searchInput" class="font-semibold text-gray-700 text-sm">Search:</label>
                        <input type="text" id="searchInput" placeholder="Range, prefix or number..." class="border border-gray-300 rounded px-3 py-2 text-sm w-full sm:w-64 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
                    </div>

                    <!-- Range Dropdown -->
                    <div class="flex items-center space-x-2 w-full sm:w-auto">
                        <label for="rangeFilter" class="font-semibold text-gray-700 text-sm">Range:</label>
                        <select id="rangeFilter" class="border border-gray-300 rounded px-3 py-2 text-sm w-full sm:w-48 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
                            <option value="All">-- Show All Ranges --</option>
                            <!-- Options injected by JS -->
                        </select>
                    </div>

                    <div class="flex items-center space-x-2">
                        <label class="font-semibold text-gray-700 text-sm">Show:</label>
                        <select class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-cyan-500">
                            <option>25</option>
                            <option>50</option>
                            <option>100</option>
                        </select>
                    </div>
                </div>

                <!-- Test Numbers Table -->
                <div class="table-container border border-gray-200">
                    <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="p-3 font-semibold text-gray-600">Range ↕</th>
                                <th class="p-3 font-semibold text-gray-600">Prefix ↕</th>
                                <th class="p-3 font-semibold text-gray-600">Test Number ↕ <span class="text-xs font-normal text-gray-400 ml-1">(Click to copy)</span></th>
                            </tr>
                        </thead>
                        <tbody id="testNumbersTableBody" class="divide-y divide-gray-200">
                            <!-- Data injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- SECTION 2: RECENT INBOUND (OTP SECTION) -->
        <div class="bg-white shadow-md rounded border border-gray-300">
            <div class="bg-gray-100 border-b border-gray-300 px-4 py-3 flex justify-between items-center">
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Recent Inbound</h2>
                <button onclick="handleRefresh()" class="bg-cyan-500 hover:bg-cyan-600 text-white px-3 py-1.5 rounded text-sm font-semibold transition flex items-center space-x-1 shadow-sm active:bg-cyan-700">
                    <svg id="refreshIcon" class="w-4 h-4 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>REFRESH</span>
                </button>
            </div>
            
            <div class="p-4">
                <!-- Recent Inbound Table -->
                <div class="table-container border border-gray-200">
                    <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="p-3 font-semibold text-gray-600">Date ↕</th>
                                <th class="p-3 font-semibold text-gray-600">Range ↕</th>
                                <th class="p-3 font-semibold text-gray-600">Number ↕</th>
                                <th class="p-3 font-semibold text-gray-600">CLI (OTP) ↕</th>
                            </tr>
                        </thead>
                        <tbody id="inboundTableBody" class="divide-y divide-gray-200">
                            <!-- Data injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Tailwind Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center space-x-2 translate-y-4">
        <svg id="toastIcon" class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toastMessage" class="font-medium">Number copied to clipboard!</span>
    </div>

    <script>
        /* =====================================================================
           MOCK ADMIN DATA
           ===================================================================== */
        const adminUploadedNumbers = [
            { range: 'Malaysia XOX LX 21Sep', prefix: '60', number: '601159053068' },
            { range: 'Malaysia XOX LX 21Sep', prefix: '60', number: '601159172628' },
            { range: 'Malaysia Maxis LX 21Sep', prefix: '60', number: '60171909556' },
            { range: 'Malaysia Maxis LX 21Sep', prefix: '60', number: '60120786227' },
            { range: 'Malaysia Digi LX 21Sep', prefix: '60', number: '601170606547' },
            { range: 'Malaysia Celcom LX 21Sep', prefix: '60', number: '601115193873' },
            { range: 'Algeria LX 15Sep', prefix: '213', number: '213540836549' },
            { range: 'Libya (K)', prefix: '218', number: '218913609672' },
            { range: 'Sri Lanka LX 02Jul', prefix: '94', number: '94769631440' }
        ];

        const receivedOTPs = [
            { date: '2026-09-22 10:23:13', range: 'Libya (K)', number: '218913609672', otpMessage: 'THY89234' },
            { date: '2026-09-22 10:19:52', range: 'Algeria LX 15Sep', number: '213540836549', otpMessage: 'BreAK552' },
            { date: '2026-09-22 10:13:34', range: 'Algeria LX 13Mar', number: '213561066169', otpMessage: 'BreAK199' },
            { date: '2026-09-22 09:58:08', range: 'Malaysia XOX LX 21Sep', number: '601159053068', otpMessage: '44799011' },
            { date: '2026-09-22 09:52:24', range: 'Sri Lanka LX 02Jul', number: '94769631440', otpMessage: 'TikTOK99' },
            { date: '2026-09-22 09:48:12', range: 'Sri Lanka LX 15Sep', number: '94771226423', otpMessage: 'ALIX9922' }
        ];


        /* =====================================================================
           USER SIDE LOGIC
           ===================================================================== */

        let toastTimeout;

        // 1. Initialize Application
        document.addEventListener('DOMContentLoaded', () => {
            populateRangeDropdown();
            filterTable(); // Initial render
            renderInbounds();

            // Setup Listeners for dynamic searching & dropdown
            document.getElementById('rangeFilter').addEventListener('change', filterTable);
            document.getElementById('searchInput').addEventListener('input', filterTable);
        });

        // 2. Populate Dropdown
        function populateRangeDropdown() {
            const dropdown = document.getElementById('rangeFilter');
            const uniqueRanges = [...new Set(adminUploadedNumbers.map(item => item.range))];
            
            uniqueRanges.forEach(range => {
                const option = document.createElement('option');
                option.value = range;
                option.textContent = range;
                dropdown.appendChild(option);
            });
        }

        // 3. Filter Table based on Dropdown AND Search Input
        function filterTable() {
            const filterRange = document.getElementById('rangeFilter').value;
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const tbody = document.getElementById('testNumbersTableBody');
            tbody.innerHTML = ''; 

            // Filter logic
            const filteredData = adminUploadedNumbers.filter(item => {
                // Check dropdown match
                const matchesRange = filterRange === 'All' || item.range === filterRange;
                
                // Check search bar match (checks range name, prefix, and number)
                const matchesSearch = searchText === '' || 
                                      item.range.toLowerCase().includes(searchText) || 
                                      item.prefix.toLowerCase().includes(searchText) || 
                                      item.number.toLowerCase().includes(searchText);

                return matchesRange && matchesSearch;
            });

            // Create Rows
            filteredData.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-blue-50 transition";
                
                tr.innerHTML = `
                    <td class="p-3 text-gray-700 border-b">${row.range}</td>
                    <td class="p-3 text-gray-700 border-b">${row.prefix}</td>
                    <td class="p-3 font-bold text-gray-900 border-b cursor-pointer group" 
                        onclick="copyToClipboard('${row.number}')" 
                        title="Click to copy">
                        <span class="border-b border-transparent group-hover:border-cyan-500 group-hover:text-cyan-600 transition">${row.number}</span>
                        <svg class="w-4 h-4 inline opacity-0 group-hover:opacity-100 transition-opacity ml-2 text-cyan-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            if(filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-gray-500 font-medium">No numbers match your search.</td></tr>`;
            }
        }

        // 4. Render Recent Inbounds (OTP Section with Masking logic)
        function renderInbounds() {
            const tbody = document.getElementById('inboundTableBody');
            tbody.innerHTML = ''; 

            receivedOTPs.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition";
                
                // Masking Logic: Take first 3 letters and add XXXX
                const rawOtp = row.otpMessage;
                const maskedOtp = rawOtp.length > 3 ? rawOtp.substring(0, 3) + 'XXXX' : rawOtp + 'XXXX';

                tr.innerHTML = `
                    <td class="p-3 text-gray-600 border-b">${row.date}</td>
                    <td class="p-3 text-gray-700 border-b">
                        ${row.range.split(' ')[0]} <br>
                        <span class="text-xs text-gray-400">${row.range}</span>
                    </td>
                    <td class="p-3 font-bold text-gray-900 border-b">${row.number}</td>
                    <td class="p-3 text-gray-700 border-b font-mono">${maskedOtp}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 5. Working Refresh Button Logic
        function handleRefresh() {
            const refreshIcon = document.getElementById('refreshIcon');
            
            // Spin Animation
            refreshIcon.classList.add('-rotate-180');
            showToast("Refreshing data...", false);

            // Simulate Network Request / Database Pull
            setTimeout(() => {
                renderInbounds(); // Re-render the data
                refreshIcon.classList.remove('-rotate-180');
                showToast("Data is up to date!", true);
            }, 800);
        }

        // 6. Copy to Clipboard Function
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`Copied: ${text}`, true);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                showToast(`Failed to copy`, false);
            });
        }

        // 7. Tailwind Toast Notification Helper
        function showToast(message, isSuccess = true) {
            const toast = document.getElementById("toast");
            const toastMessage = document.getElementById("toastMessage");
            const toastIcon = document.getElementById("toastIcon");

            // Reset existing timeout if user clicks fast
            clearTimeout(toastTimeout);

            toastMessage.textContent = message;
            
            // Toggle icon color based on success/working state
            if(isSuccess) {
                toastIcon.classList.remove("text-yellow-400", "animate-spin");
                toastIcon.classList.add("text-green-400");
                toastIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>`;
            } else {
                toastIcon.classList.remove("text-green-400");
                toastIcon.classList.add("text-yellow-400", "animate-spin");
                toastIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>`;
            }

            // Show Toast
            toast.classList.remove("opacity-0", "translate-y-4");
            toast.classList.add("opacity-100", "translate-y-0");
            
            // Hide after 2.5 seconds
            toastTimeout = setTimeout(() => {
                toast.classList.remove("opacity-100", "translate-y-0");
                toast.classList.add("opacity-0", "translate-y-4");
            }, 2500);
        }
    </script>
</body>
</html>

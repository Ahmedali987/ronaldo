<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RonaldoSmS Bot</title>
    <!-- We still load Tailwind for structural utility, but override it with 90s CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Classic 90s System Theme */
        body {
            background-color: #c0c0c0;
            font-family: 'MS Sans Serif', 'Segoe UI', Tahoma, Geneva, sans-serif;
            margin: 0;
            padding: 0;
            color: #000;
        }

        /* 3D Window Bevels */
        .win95-window {
            background: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            margin-bottom: 10px;
        }

        .win95-titlebar {
            background: #000080;
            color: white;
            font-weight: bold;
            padding: 4px 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }

        /* 3D Inputs & Selects */
        .win95-input {
            background: #ffffff;
            border-top: 2px solid #000000;
            border-left: 2px solid #000000;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            padding: 2px 4px;
            font-family: 'MS Sans Serif', Tahoma, sans-serif;
            font-size: 13px;
            outline: none;
        }

        /* 3D Buttons */
        .win95-btn {
            background: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            padding: 2px 10px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            color: black;
        }
        .win95-btn:active {
            border-top: 2px solid #000000;
            border-left: 2px solid #000000;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
        }
        .win95-btn:disabled {
            color: #808080;
            text-shadow: 1px 1px 0px #fff;
        }

        /* Classic HTML Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
        }
        th {
            background: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
            padding: 4px;
            font-size: 13px;
            text-align: left;
        }
        td {
            border: 1px solid #c0c0c0;
            padding: 4px;
            font-size: 13px;
        }

        /* Classic Blue Links */
        .classic-link {
            color: #0000ee;
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
        }
        
        .table-container {
            overflow-x: auto;
            border-top: 2px solid #000000;
            border-left: 2px solid #000000;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
        }

        /* Helper container to stretch edge-to-edge */
        .w-full-no-margin {
            width: 100%;
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- Main Edge-to-Edge Container -->
    <div class="w-full-no-margin">

        <!-- SECTION 1: TEST NUMBERS -->
        <div class="win95-window">
            <div class="win95-titlebar">
                <span>RonaldoSmS Bot - Test Numbers</span>
                <span id="numTotalBadge">Total: 0</span>
            </div>
            
            <div class="p-2">
                <!-- Controls -->
                <div class="flex flex-col sm:flex-row sm:items-center sm:space-x-4 mb-2 gap-2">
                    <div>
                        <label class="text-[13px]">Search:</label>
                        <input type="text" id="numSearchInput" class="win95-input" style="width: 150px;">
                    </div>
                    <div>
                        <label class="text-[13px]">Range:</label>
                        <select id="numRangeFilter" class="win95-input">
                            <option value="All">All Ranges</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[13px]">Show:</label>
                        <select id="numLimit" class="win95-input">
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="0">0</option> <!-- 0 = Show All -->
                        </select>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Range</th>
                                <th>Prefix</th>
                                <th>Test Number</th>
                            </tr>
                        </thead>
                        <tbody id="testNumbersTableBody">
                            <!-- Data injected via JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Footer (Info + Pagination) -->
                <div class="mt-2 flex justify-between items-center text-[13px]">
                    <div id="numInfo">Showing 0 to 0 of 0 entries</div>
                    <div id="numPagination" class="flex space-x-1"></div>
                </div>
            </div>
        </div>

        <!-- SECTION 2: RECENT INBOUND -->
        <div class="win95-window">
            <div class="win95-titlebar">
                <span>Recent Inbound OTPs</span>
                <span id="otpTotalBadge">Total OTPs: 0</span>
            </div>
            
            <div class="p-2">
                <!-- Controls -->
                <div class="flex flex-col sm:flex-row sm:items-center sm:space-x-4 mb-2 gap-2">
                    <div>
                        <label class="text-[13px]">Search:</label>
                        <input type="text" id="otpSearchInput" class="win95-input" style="width: 150px;">
                    </div>
                    <div>
                        <label class="text-[13px]">Range:</label>
                        <select id="otpRangeFilter" class="win95-input">
                            <option value="All">All Ranges</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[13px]">Show:</label>
                        <select id="otpLimit" class="win95-input">
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="0">0</option>
                        </select>
                    </div>
                    <button onclick="handleRefresh()" class="win95-btn">Refresh</button>
                </div>

                <!-- Table -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Range</th>
                                <th>Number</th>
                                <th>CLI (OTP)</th>
                            </tr>
                        </thead>
                        <tbody id="inboundTableBody">
                            <!-- Data injected via JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Footer (Info + Pagination) -->
                <div class="mt-2 flex justify-between items-center text-[13px]">
                    <div id="otpInfo">Showing 0 to 0 of 0 entries</div>
                    <div id="otpPagination" class="flex space-x-1"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        /* =====================================================================
           MOCK ADMIN DATA 
           ===================================================================== */
        const baseAdminUploadedNumbers = [
            { range: 'Malaysia XOX LX 21Sep', prefix: '60', number: '601159053068' },
            { range: 'Malaysia XOX LX 21Sep', prefix: '60', number: '601159172628' },
            { range: 'Malaysia Maxis LX 21Sep', prefix: '60', number: '60171909556' },
            { range: 'Malaysia Maxis LX 21Sep', prefix: '60', number: '60120786227' },
            { range: 'Malaysia Digi LX 21Sep', prefix: '60', number: '601170606547' },
            { range: 'Malaysia Celcom LX 21Sep', prefix: '60', number: '601115193873' },
            { range: 'Algeria LX 15Sep', prefix: '213', number: '213540836549' },
            { range: 'Libya (K)', prefix: '218', number: '218913609672' },
            { range: 'Sri Lanka LX 02Jul', prefix: '94', number: '94769631440' }
        ];
        // 36 records
        const adminUploadedNumbers = [...baseAdminUploadedNumbers, ...baseAdminUploadedNumbers, ...baseAdminUploadedNumbers, ...baseAdminUploadedNumbers];

        const baseReceivedOTPs = [
            { date: '2026-09-22 10:23:13', range: 'Libya (K)', number: '218913609672', otpMessage: 'THY89234' },
            { date: '2026-09-22 10:19:52', range: 'Algeria LX 15Sep', number: '213540836549', otpMessage: 'BreAK552' },
            { date: '2026-09-22 10:13:34', range: 'Algeria LX 13Mar', number: '213561066169', otpMessage: 'BreAK199' },
            { date: '2026-09-22 09:58:08', range: 'Malaysia XOX LX 21Sep', number: '601159053068', otpMessage: '44799011' },
            { date: '2026-09-22 09:52:24', range: 'Sri Lanka LX 02Jul', number: '94769631440', otpMessage: 'TikTOK99' },
            { date: '2026-09-22 09:48:12', range: 'Sri Lanka LX 15Sep', number: '94771226423', otpMessage: 'ALIX9922' }
        ];
        // 30 records
        const receivedOTPs = [...baseReceivedOTPs, ...baseReceivedOTPs, ...baseReceivedOTPs, ...baseReceivedOTPs, ...baseReceivedOTPs];

        /* =====================================================================
           LOGIC & PAGINATION
           ===================================================================== */
        let numCurrentPage = 1;
        let otpCurrentPage = 1;

        document.addEventListener('DOMContentLoaded', () => {
            populateRangeDropdowns();
            renderNumbers();
            renderInbounds();

            document.getElementById('numRangeFilter').addEventListener('change', () => { numCurrentPage = 1; renderNumbers(); });
            document.getElementById('numSearchInput').addEventListener('input', () => { numCurrentPage = 1; renderNumbers(); });
            document.getElementById('numLimit').addEventListener('change', () => { numCurrentPage = 1; renderNumbers(); });

            document.getElementById('otpRangeFilter').addEventListener('change', () => { otpCurrentPage = 1; renderInbounds(); });
            document.getElementById('otpSearchInput').addEventListener('input', () => { otpCurrentPage = 1; renderInbounds(); });
            document.getElementById('otpLimit').addEventListener('change', () => { otpCurrentPage = 1; renderInbounds(); });
        });

        function populateRangeDropdowns() {
            const numDropdown = document.getElementById('numRangeFilter');
            [...new Set(adminUploadedNumbers.map(i => i.range))].forEach(r => numDropdown.insertAdjacentHTML('beforeend', `<option value="${r}">${r}</option>`));

            const otpDropdown = document.getElementById('otpRangeFilter');
            [...new Set(receivedOTPs.map(i => i.range))].forEach(r => otpDropdown.insertAdjacentHTML('beforeend', `<option value="${r}">${r}</option>`));
        }

        // ================= TEST NUMBERS =================
        function renderNumbers() {
            const filterRange = document.getElementById('numRangeFilter').value;
            const searchText = document.getElementById('numSearchInput').value.toLowerCase();
            let limit = parseInt(document.getElementById('numLimit').value);
            
            const tbody = document.getElementById('testNumbersTableBody');
            tbody.innerHTML = ''; 

            const filteredData = adminUploadedNumbers.filter(item => {
                const matchesRange = filterRange === 'All' || item.range === filterRange;
                const matchesSearch = searchText === '' || 
                                      item.range.toLowerCase().includes(searchText) || 
                                      item.prefix.toLowerCase().includes(searchText) || 
                                      item.number.toLowerCase().includes(searchText);
                return matchesRange && matchesSearch;
            });

            document.getElementById('numTotalBadge').textContent = `Total: ${filteredData.length}`;

            if(filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding: 10px;">0 Records Found</td></tr>`;
                document.getElementById('numInfo').textContent = `Showing 0 to 0 of 0 entries`;
                document.getElementById('numPagination').innerHTML = '';
                return;
            }

            // If 0, show all
            if (limit === 0) limit = filteredData.length;

            const totalPages = Math.ceil(filteredData.length / limit);
            if (numCurrentPage > totalPages) numCurrentPage = totalPages;
            if (numCurrentPage < 1) numCurrentPage = 1;

            const startIndex = (numCurrentPage - 1) * limit;
            const paginatedData = filteredData.slice(startIndex, startIndex + limit);

            paginatedData.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.range}</td>
                    <td>${row.prefix}</td>
                    <td>
                        <span class="classic-link" onclick="copyToClipboard(this, '${row.number}')">${row.number}</span>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            const endIdx = Math.min(startIndex + limit, filteredData.length);
            document.getElementById('numInfo').textContent = `Showing ${startIndex + 1} to ${endIdx} of ${filteredData.length} entries`;
            buildPagination(totalPages, numCurrentPage, 'numPagination', 'changeNumPage');
        }

        window.changeNumPage = function(page) {
            numCurrentPage = page;
            renderNumbers();
        };

        // ================= INBOUND OTPS =================
        function renderInbounds() {
            const filterRange = document.getElementById('otpRangeFilter').value;
            const searchText = document.getElementById('otpSearchInput').value.toLowerCase();
            let limit = parseInt(document.getElementById('otpLimit').value);
            
            const tbody = document.getElementById('inboundTableBody');
            tbody.innerHTML = ''; 

            const filteredData = receivedOTPs.filter(item => {
                const matchesRange = filterRange === 'All' || item.range === filterRange;
                const matchesSearch = searchText === '' || 
                                      item.range.toLowerCase().includes(searchText) || 
                                      item.number.toLowerCase().includes(searchText) ||
                                      item.otpMessage.toLowerCase().includes(searchText);
                return matchesRange && matchesSearch;
            });

            document.getElementById('otpTotalBadge').textContent = `Total OTPs: ${filteredData.length}`;

            if(filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 10px;">0 Records Found</td></tr>`;
                document.getElementById('otpInfo').textContent = `Showing 0 to 0 of 0 entries`;
                document.getElementById('otpPagination').innerHTML = '';
                return;
            }

            // If 0, show all
            if (limit === 0) limit = filteredData.length;

            const totalPages = Math.ceil(filteredData.length / limit);
            if (otpCurrentPage > totalPages) otpCurrentPage = totalPages;
            if (otpCurrentPage < 1) otpCurrentPage = 1;

            const startIndex = (otpCurrentPage - 1) * limit;
            const paginatedData = filteredData.slice(startIndex, startIndex + limit);

            paginatedData.forEach(row => {
                const tr = document.createElement('tr');
                const rawOtp = row.otpMessage;
                const maskedOtp = rawOtp.length > 3 ? rawOtp.substring(0, 3) + 'XXXX' : rawOtp + 'XXXX';

                tr.innerHTML = `
                    <td>${row.date}</td>
                    <td>${row.range}</td>
                    <td>${row.number}</td>
                    <td style="font-family: monospace;">${maskedOtp}</td>
                `;
                tbody.appendChild(tr);
            });

            const endIdx = Math.min(startIndex + limit, filteredData.length);
            document.getElementById('otpInfo').textContent = `Showing ${startIndex + 1} to ${endIdx} of ${filteredData.length} entries`;
            buildPagination(totalPages, otpCurrentPage, 'otpPagination', 'changeOtpPage');
        }

        window.changeOtpPage = function(page) {
            otpCurrentPage = page;
            renderInbounds();
        };

        // ================= PAGINATION BUILDER =================
        function buildPagination(totalPages, currentPage, containerId, callbackFn) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            if(totalPages <= 1) return;

            const prevDisabled = currentPage === 1;
            container.insertAdjacentHTML('beforeend', `
                <button onclick="${callbackFn}(${currentPage - 1})" class="win95-btn" ${prevDisabled ? 'disabled' : ''}>Prev</button>
            `);

            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    // Active button styling for 90s
                    container.insertAdjacentHTML('beforeend', `<button class="win95-btn" style="border-top: 2px solid #000; border-left: 2px solid #000; border-right: 2px solid #fff; border-bottom: 2px solid #fff;" disabled>${i}</button>`);
                } else {
                    container.insertAdjacentHTML('beforeend', `<button onclick="${callbackFn}(${i})" class="win95-btn">${i}</button>`);
                }
            }

            const nextDisabled = currentPage === totalPages;
            container.insertAdjacentHTML('beforeend', `
                <button onclick="${callbackFn}(${currentPage + 1})" class="win95-btn" ${nextDisabled ? 'disabled' : ''}>Next</button>
            `);
        }

        // ================= UTILITIES =================
        function handleRefresh() {
            otpCurrentPage = 1;
            renderInbounds(); 
        }

        function copyToClipboard(element, text) {
            navigator.clipboard.writeText(text).then(() => {
                // Turn green, remove underline
                element.style.color = '#00aa00';
                element.style.textDecoration = 'none';
                
                // Revert after 2 seconds
                setTimeout(() => {
                    element.style.color = '#0000ee';
                    element.style.textDecoration = 'underline';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>
</html>

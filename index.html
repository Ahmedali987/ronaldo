<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronaldo Bot Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom Scrollbar for tables */
        .table-container::-webkit-scrollbar {
            height: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header Section -->
    <header class="w-full pt-12 pb-8 px-4 text-center">
        <div class="flex justify-center items-center space-x-3 mb-4">
            <!-- Bot Icon -->
            <div class="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-200">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-700 to-blue-500 tracking-tight">
                Ronaldo Bot
            </h1>
        </div>
        
        <!-- Beautiful Subheading -->
        <div class="max-w-2xl mx-auto mt-6">
            <div class="inline-flex items-center space-x-2 bg-white/80 backdrop-blur-md border border-slate-200/60 shadow-sm py-2.5 px-5 rounded-full text-sm md:text-base text-slate-600">
                <svg class="w-5 h-5 text-amber-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                </svg>
                <span>Text this numbers in your service these are the numbers for testing otps may not be received.</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 pb-16 w-full space-y-8 flex-grow">

        <!-- SECTION 1: TEST NUMBERS -->
        <div class="bg-white shadow-xl shadow-slate-200/50 rounded-2xl overflow-hidden border border-slate-100">
            <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex items-center space-x-2">
                <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                <h2 class="text-sm font-bold text-slate-800 uppercase tracking-widest">Test Numbers</h2>
            </div>
            
            <div class="p-6 space-y-6">
                <!-- Controls: Search Bar & Dropdown -->
                <div class="flex flex-col md:flex-row md:items-center space-y-4 md:space-y-0 md:space-x-6">
                    
                    <!-- Search Input -->
                    <div class="flex-1">
                        <label for="searchInput" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Search Records</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </div>
                            <input type="text" id="searchInput" placeholder="Range, prefix or number..." class="pl-10 w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white block p-2.5 transition-colors duration-200">
                        </div>
                    </div>

                    <!-- Range Dropdown -->
                    <div class="flex-1 md:max-w-xs">
                        <label for="rangeFilter" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Filter by Range</label>
                        <select id="rangeFilter" class="bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white block w-full p-2.5 transition-colors duration-200 cursor-pointer">
                            <option value="All">All Ranges</option>
                            <!-- Options injected by JS -->
                        </select>
                    </div>

                    <!-- Show Records -->
                    <div class="w-full md:w-auto">
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Show</label>
                        <select class="bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white block w-full p-2.5 transition-colors duration-200 cursor-pointer">
                            <option>25</option>
                            <option>50</option>
                            <option>100</option>
                        </select>
                    </div>
                </div>

                <!-- Test Numbers Table -->
                <div class="table-container rounded-xl border border-slate-200 overflow-x-auto bg-white">
                    <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="p-4 font-semibold text-slate-600 border-b border-slate-200">Range</th>
                                <th class="p-4 font-semibold text-slate-600 border-b border-slate-200">Prefix</th>
                                <th class="p-4 font-semibold text-slate-600 border-b border-slate-200">Test Number <span class="font-normal text-slate-400 ml-1">(Click to copy)</span></th>
                            </tr>
                        </thead>
                        <tbody id="testNumbersTableBody" class="divide-y divide-slate-100">
                            <!-- Data injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- SECTION 2: RECENT INBOUND (OTP SECTION) -->
        <div class="bg-white shadow-xl shadow-slate-200/50 rounded-2xl overflow-hidden border border-slate-100">
            <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    <h2 class="text-sm font-bold text-slate-800 uppercase tracking-widest">Recent Inbound</h2>
                </div>
                <button onclick="handleRefresh()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 flex items-center space-x-2 shadow-md shadow-indigo-200 active:scale-95">
                    <svg id="refreshIcon" class="w-4 h-4 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>Refresh</span>
                </button>
            </div>
            
            <div class="p-6">
                <!-- Recent Inbound Table -->
                <div class="table-container rounded-xl border border-slate-200 overflow-x-auto bg-white">
                    <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="p-4 font-semibold text-slate-600 border-b border-slate-200">Date</th>
                                <th class="p-4 font-semibold text-slate-600 border-b border-slate-200">Range</th>
                                <th class="p-4 font-semibold text-slate-600 border-b border-slate-200">Number</th>
                                <th class="p-4 font-semibold text-slate-600 border-b border-slate-200">CLI (OTP)</th>
                            </tr>
                        </thead>
                        <tbody id="inboundTableBody" class="divide-y divide-slate-100">
                            <!-- Data injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- Tailwind Toast Notification (Beautiful floating pill) -->
    <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center space-x-3 translate-y-6">
        <div id="toastIconContainer" class="bg-white/10 rounded-full p-1">
            <svg id="toastIcon" class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <span id="toastMessage" class="font-medium text-sm pr-2">Number copied to clipboard!</span>
    </div>

    <script>
        /* =====================================================================
           MOCK ADMIN DATA
           ===================================================================== */
        const adminUploadedNumbers = [
            { range: 'Malaysia XOX LX 21Sep', prefix: '60', number: '601159053068' },
            { range: 'Malaysia XOX LX 21Sep', prefix: '60', number: '601159172628' },
            { range: 'Malaysia Maxis LX 21Sep', prefix: '60', number: '60171909556' },
            { range: 'Malaysia Maxis LX 21Sep', prefix: '60', number: '60120786227' },
            { range: 'Malaysia Digi LX 21Sep', prefix: '60', number: '601170606547' },
            { range: 'Malaysia Celcom LX 21Sep', prefix: '60', number: '601115193873' },
            { range: 'Algeria LX 15Sep', prefix: '213', number: '213540836549' },
            { range: 'Libya (K)', prefix: '218', number: '218913609672' },
            { range: 'Sri Lanka LX 02Jul', prefix: '94', number: '94769631440' }
        ];

        const receivedOTPs = [
            { date: '2026-09-22 10:23:13', range: 'Libya (K)', number: '218913609672', otpMessage: 'THY89234' },
            { date: '2026-09-22 10:19:52', range: 'Algeria LX 15Sep', number: '213540836549', otpMessage: 'BreAK552' },
            { date: '2026-09-22 10:13:34', range: 'Algeria LX 13Mar', number: '213561066169', otpMessage: 'BreAK199' },
            { date: '2026-09-22 09:58:08', range: 'Malaysia XOX LX 21Sep', number: '601159053068', otpMessage: '44799011' },
            { date: '2026-09-22 09:52:24', range: 'Sri Lanka LX 02Jul', number: '94769631440', otpMessage: 'TikTOK99' },
            { date: '2026-09-22 09:48:12', range: 'Sri Lanka LX 15Sep', number: '94771226423', otpMessage: 'ALIX9922' }
        ];

        /* =====================================================================
           USER SIDE LOGIC
           ===================================================================== */
        let toastTimeout;

        // 1. Initialize Application
        document.addEventListener('DOMContentLoaded', () => {
            populateRangeDropdown();
            filterTable(); 
            renderInbounds();

            // Setup Listeners
            document.getElementById('rangeFilter').addEventListener('change', filterTable);
            document.getElementById('searchInput').addEventListener('input', filterTable);
        });

        // 2. Populate Dropdown
        function populateRangeDropdown() {
            const dropdown = document.getElementById('rangeFilter');
            const uniqueRanges = [...new Set(adminUploadedNumbers.map(item => item.range))];
            
            uniqueRanges.forEach(range => {
                const option = document.createElement('option');
                option.value = range;
                option.textContent = range;
                dropdown.appendChild(option);
            });
        }

        // 3. Filter Table based on Dropdown AND Search Input
        function filterTable() {
            const filterRange = document.getElementById('rangeFilter').value;
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const tbody = document.getElementById('testNumbersTableBody');
            tbody.innerHTML = ''; 

            const filteredData = adminUploadedNumbers.filter(item => {
                const matchesRange = filterRange === 'All' || item.range === filterRange;
                const matchesSearch = searchText === '' || 
                                      item.range.toLowerCase().includes(searchText) || 
                                      item.prefix.toLowerCase().includes(searchText) || 
                                      item.number.toLowerCase().includes(searchText);
                return matchesRange && matchesSearch;
            });

            filteredData.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-indigo-50/50 transition-colors duration-200 group";
                
                tr.innerHTML = `
                    <td class="p-4 text-slate-700 font-medium">${row.range}</td>
                    <td class="p-4 text-slate-500">${row.prefix}</td>
                    <td class="p-4 font-bold text-slate-900 cursor-pointer" 
                        onclick="copyToClipboard('${row.number}')" 
                        title="Click to copy">
                        <span class="border-b border-transparent group-hover:border-indigo-500 group-hover:text-indigo-600 transition-all duration-200">${row.number}</span>
                        <div class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-indigo-100 opacity-0 group-hover:opacity-100 transition-all duration-200 ml-3 transform group-hover:scale-110">
                            <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            if(filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-slate-500 font-medium bg-slate-50/50">No numbers match your search criteria.</td></tr>`;
            }
        }

        // 4. Render Recent Inbounds (OTP Section with Masking logic)
        function renderInbounds() {
            const tbody = document.getElementById('inboundTableBody');
            tbody.innerHTML = ''; 

            receivedOTPs.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-indigo-50/50 transition-colors duration-200";
                
                // Masking Logic: Take first 3 letters and add XXXX
                const rawOtp = row.otpMessage;
                const maskedOtp = rawOtp.length > 3 ? rawOtp.substring(0, 3) + 'XXXX' : rawOtp + 'XXXX';

                tr.innerHTML = `
                    <td class="p-4 text-slate-500 text-xs font-medium">${row.date}</td>
                    <td class="p-4">
                        <div class="text-slate-800 font-medium">${row.range.split(' ')[0]}</div>
                        <div class="text-xs text-slate-400 mt-0.5">${row.range}</div>
                    </td>
                    <td class="p-4 font-bold text-slate-900">${row.number}</td>
                    <td class="p-4">
                        <span class="inline-flex items-center px-2.5 py-1 rounded-md text-sm font-mono font-bold bg-slate-100 text-slate-700 border border-slate-200">
                            ${maskedOtp}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 5. Working Refresh Button Logic
        function handleRefresh() {
            const refreshIcon = document.getElementById('refreshIcon');
            
            refreshIcon.classList.add('-rotate-180');
            showToast("Syncing data...", false);

            setTimeout(() => {
                renderInbounds(); 
                refreshIcon.classList.remove('-rotate-180');
                showToast("Data is up to date!", true);
            }, 1000);
        }

        // 6. Copy to Clipboard Function
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`Copied: ${text}`, true);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                showToast(`Failed to copy`, false);
            });
        }

        // 7. Tailwind Toast Notification Helper
        function showToast(message, isSuccess = true) {
            const toast = document.getElementById("toast");
            const toastMessage = document.getElementById("toastMessage");
            const toastIcon = document.getElementById("toastIcon");

            clearTimeout(toastTimeout);

            toastMessage.textContent = message;
            
            if(isSuccess) {
                toastIcon.classList.remove("text-amber-400", "animate-spin");
                toastIcon.classList.add("text-emerald-400");
                toastIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>`;
            } else {
                toastIcon.classList.remove("text-emerald-400");
                toastIcon.classList.add("text-amber-400", "animate-spin");
                toastIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>`;
            }

            toast.classList.remove("opacity-0", "translate-y-6");
            toast.classList.add("opacity-100", "translate-y-0");
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove("opacity-100", "translate-y-0");
                toast.classList.add("opacity-0", "translate-y-6");
            }, 3000);
        }
    </script>
</body>
</html>

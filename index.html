<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronaldo Bot - Premium Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-image: radial-gradient(circle at top, #f8fafc 0%, #e2e8f0 100%);
            background-attachment: fixed;
        }
        
        /* Custom sleek scrollbar for tables to ensure smooth horizontal scrolling */
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .table-container::-webkit-scrollbar {
            height: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <!-- Header Section -->
    <header class="w-full pt-16 pb-8 px-4 text-center relative z-10">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-brand-500/10 blur-[100px] rounded-full pointer-events-none"></div>

        <div class="flex justify-center items-center space-x-4 mb-6 relative z-10">
            <div class="bg-gradient-to-br from-brand-500 to-indigo-600 p-3 rounded-2xl shadow-lg shadow-brand-500/30">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight drop-shadow-sm">
                Ronaldo Bot
            </h1>
        </div>
        
        <!-- Subheading -->
        <div class="max-w-2xl mx-auto relative z-10">
            <div class="inline-flex items-center space-x-3 bg-white/80 backdrop-blur-md border border-slate-200/60 shadow-sm py-3 px-6 rounded-full text-sm md:text-base text-slate-600 font-medium">
                <div class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span>
                </div>
                <span>Text these numbers in your service for testing. OTPs may not be received.</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 pb-20 w-full space-y-8 flex-grow relative z-10">

        <!-- SECTION 1: TEST NUMBERS -->
        <div class="glass-card shadow-xl shadow-slate-200/40 rounded-2xl overflow-hidden">
            <div class="px-6 py-4 flex items-center space-x-3 border-b border-slate-200/60 bg-white/50">
                <div class="bg-brand-100 p-2 rounded-lg">
                    <svg class="w-5 h-5 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                </div>
                <h2 class="text-sm font-bold text-slate-800 uppercase tracking-widest">Test Numbers</h2>
            </div>
            
            <div class="p-6 space-y-6">
                <!-- Controls: Search Bar, Dropdown, Show Records -->
                <div class="flex flex-col lg:flex-row lg:items-end space-y-4 lg:space-y-0 lg:space-x-4">
                    
                    <!-- Search Input -->
                    <div class="flex-1">
                        <label for="searchInput" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Search Records</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-brand-500 transition-colors">
                                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </div>
                            <input type="text" id="searchInput" placeholder="Search range, prefix or number..." class="pl-11 w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block p-3 outline-none transition-shadow shadow-sm hover:border-slate-300">
                        </div>
                    </div>

                    <!-- Range Dropdown -->
                    <div class="flex-1 lg:max-w-xs">
                        <label for="rangeFilter" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Filter by Range</label>
                        <select id="rangeFilter" class="bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block w-full p-3 outline-none transition-shadow shadow-sm hover:border-slate-300 cursor-pointer">
                            <option value="All">All Available Ranges</option>
                            <!-- Options injected by JS -->
                        </select>
                    </div>

                    <!-- Show Records (Now functional) -->
                    <div class="w-full lg:w-32">
                        <label for="recordLimit" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Show</label>
                        <select id="recordLimit" class="bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 block w-full p-3 outline-none transition-shadow shadow-sm hover:border-slate-300 cursor-pointer">
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>

                <!-- Test Numbers Table -->
                <div class="table-container rounded-xl border border-slate-200 bg-white shadow-sm">
                    <table class="w-full text-left border-collapse text-sm min-w-max">
                        <thead class="bg-slate-50 border-b border-slate-200">
                            <tr>
                                <th class="py-4 px-6 font-bold text-slate-600 uppercase text-xs tracking-wider">Range</th>
                                <th class="py-4 px-6 font-bold text-slate-600 uppercase text-xs tracking-wider">Prefix</th>
                                <th class="py-4 px-6 font-bold text-slate-600 uppercase text-xs tracking-wider">Test Number <span class="font-normal text-slate-400 ml-1 normal-case">(Click to copy)</span></th>
                            </tr>
                        </thead>
                        <tbody id="testNumbersTableBody">
                            <!-- Data injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- SECTION 2: RECENT INBOUND (OTP SECTION) -->
        <div class="glass-card shadow-xl shadow-slate-200/40 rounded-2xl overflow-hidden">
            <div class="px-6 py-4 flex justify-between items-center border-b border-slate-200/60 bg-white/50 flex-wrap gap-4">
                <div class="flex items-center space-x-3">
                    <div class="bg-emerald-100 p-2 rounded-lg">
                        <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    </div>
                    <h2 class="text-sm font-bold text-slate-800 uppercase tracking-widest">Recent Inbound</h2>
                </div>
                
                <!-- Refresh Button -->
                <button onclick="handleRefresh()" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-colors flex items-center space-x-2 shadow-sm active:scale-95">
                    <svg id="refreshIcon" class="w-4 h-4 transition-transform duration-700 ease-in-out" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>Refresh Data</span>
                </button>
            </div>
            
            <div class="p-6">
                <!-- Recent Inbound Table -->
                <div class="table-container rounded-xl border border-slate-200 bg-white shadow-sm">
                    <table class="w-full text-left border-collapse text-sm min-w-max">
                        <thead class="bg-slate-50 border-b border-slate-200">
                            <tr>
                                <th class="py-4 px-6 font-bold text-slate-600 uppercase text-xs tracking-wider">Date & Time</th>
                                <th class="py-4 px-6 font-bold text-slate-600 uppercase text-xs tracking-wider">Range Detail</th>
                                <th class="py-4 px-6 font-bold text-slate-600 uppercase text-xs tracking-wider">Number</th>
                                <th class="py-4 px-6 font-bold text-slate-600 uppercase text-xs tracking-wider">CLI (OTP Code)</th>
                            </tr>
                        </thead>
                        <tbody id="inboundTableBody">
                            <!-- Data injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- Tailwind Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-5 py-3.5 rounded-xl shadow-2xl transition-all duration-300 ease-out opacity-0 pointer-events-none z-50 flex items-center space-x-3 translate-y-8">
        <div id="toastIconContainer" class="bg-white/10 rounded-full p-1.5 shadow-inner">
            <svg id="toastIcon" class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <span id="toastMessage" class="font-semibold text-sm tracking-wide pr-2">Number copied to clipboard!</span>
    </div>

    <script>
        /* =====================================================================
           MOCK ADMIN DATA
           ===================================================================== */
        // Generates more mock data so the "Show 25/50" dropdown functionality is obvious
        const adminUploadedNumbers = [
            { range: 'Malaysia XOX LX 21Sep', prefix: '60', number: '601159053068' },
            { range: 'Malaysia XOX LX 21Sep', prefix: '60', number: '601159172628' },
            { range: 'Malaysia Maxis LX 21Sep', prefix: '60', number: '60171909556' },
            { range: 'Malaysia Maxis LX 21Sep', prefix: '60', number: '60120786227' },
            { range: 'Malaysia Digi LX 21Sep', prefix: '60', number: '601170606547' },
            { range: 'Malaysia Celcom LX 21Sep', prefix: '60', number: '601115193873' },
            { range: 'Algeria LX 15Sep', prefix: '213', number: '213540836549' },
            { range: 'Libya (K)', prefix: '218', number: '218913609672' },
            { range: 'Sri Lanka LX 02Jul', prefix: '94', number: '94769631440' }
        ];

        const receivedOTPs = [
            { date: '2026-09-22 10:23:13', range: 'Libya (K)', number: '218913609672', otpMessage: 'THY89234' },
            { date: '2026-09-22 10:19:52', range: 'Algeria LX 15Sep', number: '213540836549', otpMessage: 'BreAK552' },
            { date: '2026-09-22 10:13:34', range: 'Algeria LX 13Mar', number: '213561066169', otpMessage: 'BreAK199' },
            { date: '2026-09-22 09:58:08', range: 'Malaysia XOX LX 21Sep', number: '601159053068', otpMessage: '44799011' },
            { date: '2026-09-22 09:52:24', range: 'Sri Lanka LX 02Jul', number: '94769631440', otpMessage: 'TikTOK99' },
            { date: '2026-09-22 09:48:12', range: 'Sri Lanka LX 15Sep', number: '94771226423', otpMessage: 'ALIX9922' }
        ];

        /* =====================================================================
           USER SIDE LOGIC
           ===================================================================== */
        let toastTimeout;

        document.addEventListener('DOMContentLoaded', () => {
            populateRangeDropdown();
            filterTable(); 
            renderInbounds();

            // Event Listeners for Filters
            document.getElementById('rangeFilter').addEventListener('change', filterTable);
            document.getElementById('searchInput').addEventListener('input', filterTable);
            document.getElementById('recordLimit').addEventListener('change', filterTable);
        });

        function populateRangeDropdown() {
            const dropdown = document.getElementById('rangeFilter');
            const uniqueRanges = [...new Set(adminUploadedNumbers.map(item => item.range))];
            
            uniqueRanges.forEach(range => {
                const option = document.createElement('option');
                option.value = range;
                option.textContent = range;
                dropdown.appendChild(option);
            });
        }

        function filterTable() {
            const filterRange = document.getElementById('rangeFilter').value;
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const recordLimit = parseInt(document.getElementById('recordLimit').value); // Get row limit
            const tbody = document.getElementById('testNumbersTableBody');
            
            tbody.innerHTML = ''; 

            // 1. Filter the data based on Search and Dropdown
            let filteredData = adminUploadedNumbers.filter(item => {
                const matchesRange = filterRange === 'All' || item.range === filterRange;
                const matchesSearch = searchText === '' || 
                                      item.range.toLowerCase().includes(searchText) || 
                                      item.prefix.toLowerCase().includes(searchText) || 
                                      item.number.toLowerCase().includes(searchText);
                return matchesRange && matchesSearch;
            });

            // 2. Apply the row limit (25, 50, 100)
            filteredData = filteredData.slice(0, recordLimit);

            // 3. Render the table rows
            filteredData.forEach(row => {
                const tr = document.createElement('tr');
                // Structural fix: removed transforms on tr, applied clean background hover & border
                tr.className = "hover:bg-brand-50/60 transition-colors bg-white border-b border-slate-100 last:border-0 group";
                
                tr.innerHTML = `
                    <td class="py-4 px-6 text-slate-700 font-medium">${row.range}</td>
                    <td class="py-4 px-6 text-slate-500">${row.prefix}</td>
                    <td class="py-4 px-6 font-bold text-slate-900 cursor-pointer" 
                        onclick="copyToClipboard('${row.number}')" 
                        title="Click to copy">
                        
                        <div class="flex items-center space-x-2">
                            <span class="group-hover:text-brand-600 transition-colors">${row.number}</span>
                            
                            <!-- Copy icon indicator -->
                            <div class="inline-flex items-center justify-center w-6 h-6 rounded-md bg-brand-100 text-brand-600 opacity-0 group-hover:opacity-100 transition-opacity">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            </div>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Empty state handling
            if(filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-slate-400 font-medium bg-slate-50/50">No numbers match your search criteria.</td></tr>`;
            }
        }

        function renderInbounds() {
            const tbody = document.getElementById('inboundTableBody');
            tbody.innerHTML = ''; 

            receivedOTPs.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition-colors bg-white border-b border-slate-100 last:border-0";
                
                // Masking Logic: Exactly 3 letters + XXXX
                const rawOtp = row.otpMessage;
                const maskedOtp = rawOtp.length > 3 
                    ? rawOtp.substring(0, 3) + '<span class="text-white/50">XXXX</span>' 
                    : rawOtp + '<span class="text-white/50">XXXX</span>';

                tr.innerHTML = `
                    <td class="py-4 px-6">
                        <div class="text-slate-700 font-semibold text-sm">${row.date.split(' ')[0]}</div>
                        <div class="text-slate-400 text-xs mt-0.5">${row.date.split(' ')[1]}</div>
                    </td>
                    <td class="py-4 px-6">
                        <div class="text-slate-800 font-bold">${row.range.split(' ')[0]}</div>
                        <div class="text-xs font-medium text-brand-500 mt-0.5">${row.range}</div>
                    </td>
                    <td class="py-4 px-6 font-extrabold text-slate-800 text-base">${row.number}</td>
                    <td class="py-4 px-6">
                        <span class="inline-flex items-center px-3 py-1.5 rounded-lg text-sm font-mono font-bold bg-slate-800 text-white shadow-sm">
                            ${maskedOtp}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function handleRefresh() {
            const refreshIcon = document.getElementById('refreshIcon');
            
            // Spin animation
            refreshIcon.classList.add('rotate-180');
            showToast("Syncing latest data...", false);

            setTimeout(() => {
                renderInbounds(); 
                refreshIcon.classList.remove('rotate-180');
                showToast("Data successfully synced!", true);
            }, 800);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`Copied: ${text}`, true);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                showToast(`Failed to copy`, false);
            });
        }

        function showToast(message, isSuccess = true) {
            const toast = document.getElementById("toast");
            const toastMessage = document.getElementById("toastMessage");
            const toastIcon = document.getElementById("toastIcon");

            clearTimeout(toastTimeout);

            toastMessage.textContent = message;
            
            if(isSuccess) {
                toastIcon.classList.remove("text-amber-400", "animate-spin");
                toastIcon.classList.add("text-emerald-400");
                toastIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>`;
            } else {
                toastIcon.classList.remove("text-emerald-400");
                toastIcon.classList.add("text-amber-400", "animate-spin");
                toastIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>`;
            }

            toast.classList.remove("opacity-0", "translate-y-8");
            toast.classList.add("opacity-100", "translate-y-0");
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove("opacity-100", "translate-y-0");
                toast.classList.add("opacity-0", "translate-y-8");
            }, 2500);
        }
    </script>
</body>
</html>
